<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EFECE5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#556B6F"/>
      <stop offset="100%" stop-color="#3D4E51"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F1F1E" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(85, 107, 111, 0.15)" stroke-width="4"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#556B6F" stroke-width="10" stroke-opacity="0.25" stroke-dasharray="8 12"/>
  
  <!-- Map Pin / Journey Marker with Shadow -->
  <g filter="url(#shadow)">
    <!-- Pin Body -->
    <path d="M256 100 C185 100, 128 157, 128 228 C128 320, 240 404, 250 412 C253.5 414.5, 258.5 414.5, 262 412 C272 404, 384 320, 384 228 C384 157, 327 100, 256 100 Z" 
          fill="url(#accent)"/>
    <!-- Inner Center Disc -->
    <circle cx="256" cy="228" r="54" fill="#F8F6F1"/>
    <!-- Little Compass Needle Star -->
    <path d="M256 194 L266 220 L290 228 L266 236 L256 262 L246 236 L222 228 L246 220 Z" fill="#B27B1E"/>
  </g>
</svg>
